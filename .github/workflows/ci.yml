name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install and exercise artifacts outside the source tree
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m venv "$RUNNER_TEMP/artifact-env"
            "$RUNNER_TEMP/artifact-env/bin/python" -m pip install "$artifact"
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/artifact-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_install.py")
            "$RUNNER_TEMP/artifact-env/bin/python" -m pip check
            rm -rf "$RUNNER_TEMP/artifact-env"
          done
